# E4 final evaluation (D-045). Written and committed before any 2025 data is
# used beyond the M1 validation. Used only by run_replay --e4, which requires
# a clean tree whose HEAD is the commit tagged e4-freeze.
freeze_tag: e4-freeze
initial_train: ["2024-01", "2024-12"]
months: ["2025-01", "2025-12"]
policies: [never_retrained, triggered, scheduled]
hypotheses:
  H1: "primary: mean AP of scheduled > mean AP of never_retrained over 2025-01..2025-12"
  H2: "secondary: mean AP of triggered vs never_retrained over 2025-01..2025-12"
